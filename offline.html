<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monofilms | Sin conexión</title>
    <link rel="manifest" href="manifest.json">

    <!-- Favicon explícito en todos los formatos -->
    <link rel="icon" type="image/png" sizes="192x192" href="./imagenes/ICONOS/LOGO-APP.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./imagenes/ICONOS/LOGO-APP.png">
    <link rel="apple-touch-icon" sizes="192x192" href="./imagenes/ICONOS/LOGO-APP.png">

    <link href="https://fonts.googleapis.com/css2?family=Jockey+One&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body style="display:flex;flex-direction:column;min-height:100vh;padding-top:0;padding-bottom:0;">

  <div class="header-fijo-wrapper" style="position:static;">
    <header class="navbar-superior">
      <div class="navbar-inner" style="grid-template-columns:1fr;">
        <div class="logo-area" style="cursor:default;">
          <img src="LOGO-APP.png" alt="MonoFilms Logo" class="avatar-mono">
          <h1 class="logo-texto">Mono<span>Films</span></h1>
        </div>
      </div>
    </header>
  </div>

  <main id="contenido-principal" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;flex:1;padding:40px 4%;">

    <div style="margin-bottom:24px;width:120px;height:120px;">
      <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 257.7 179.3" style="width:100%;height:100%;overflow:visible;">
        <path fill="var(--accent)" d="M216.6,36.2c22.6-0.1,41,18.1,41.1,40.6c0.1,22.9-18.1,41.3-40.9,41.3c-22.7,0-41-18.3-41.1-41C175.7,54.4,193.9,36.2,216.6,36.2z M216.8,50.2c-1.8,0-3.5,0.1-5.3,0c-1.6-0.1-2,0.5-1.9,2.1c0.6,7.2,1.1,14.4,1.6,21.6c0.5,6.1,1,12.2,1.4,18.2c0.1,1.3,0.5,1.8,1.8,1.7c1.4-0.1,2.9-0.1,4.3,0c1.5,0.1,1.9-0.5,2-1.9c0.4-5.8,0.8-11.7,1.3-17.5c0.6-7.5,1.1-14.9,1.7-22.4c0.1-1.6-0.4-2-1.9-1.9C220.2,50.3,218.5,50.2,216.8,50.2z M212.1,98c0.4,1.9,0.3,3.9,1.3,5.2c0.7,0.9,2.8,0.7,4.2,0.8c0.8,0,2-0.2,2.2-0.7c0.6-1.6,0.9-3.3,1.4-5.2C218.1,98,215.3,98,212.1,98z"/>
        <path fill="var(--accent)" d="M0,52.5C53.7-3,145.1-18,217.2,24.5c-0.7,0-1.4,0-2,0c-10.4-0.3-20,2.3-29,7.6c-0.7,0.4-1.8,0.4-2.5,0.1c-21.1-8-42.9-11.5-65.4-10.2C79,24.4,45.2,39.4,16.7,66.5c-0.5,0.5-1,0.9-1.5,1.3C10.2,62.7,5.1,57.7,0,52.5z"/>

        <path fill="var(--accent)" d="M185.2,121.1c-2.6,2.6-5,5.1-7.6,7.7c-14.2-13.5-31-20.8-50.7-20.8c-19.7,0-36.5,7.2-50.6,20.7c-5.1-5.2-10.1-10.2-15.2-15.4c0.1-0.1,0.4-0.5,0.7-0.9c16.3-15.4,35.5-24.2,57.9-26c14.6-1.2,28.7,1,42.3,6.4c1.3,0.5,2,1.3,2.4,2.6c3.9,10.1,10.3,18.2,19.1,24.4C184.2,120.4,184.7,120.8,185.2,121.1z"/>
        <path fill="var(--accent)" d="M156.1,150.3c-9.7,9.7-19.5,19.4-29.1,29c-9.5-9.5-19.3-19.3-29.1-29.1C111.8,134.8,140.4,133.6,156.1,150.3z"/>
      </svg>
    </div>

    <h1 style="font-family:'Inter',sans-serif;font-weight:700;font-size:2.2rem;letter-spacing:-0.02em;margin-bottom:12px;color:var(--text-primary);">
      Sin conexión a internet
    </h1>

    <p id="estado-mensaje" style="font-family:'Inter',sans-serif;color:var(--text-sub);font-size:1.05rem;max-width:480px;margin:0 auto 36px auto;line-height:1.6;">
      No pudimos conectar con los servidores de Monofilms. Por favor, revisá tu conexión a internet o intenta recargar la página.
    </p>

    <button id="btn-reintentar" style="font-family:'Inter',sans-serif;background:var(--accent);color:var(--bg-base);border:none;padding:14px 42px;font-weight:700;border-radius:24px;cursor:pointer;font-size:0.9rem;text-transform:uppercase;letter-spacing:0.05em;transition:opacity 0.2s ease;">
      Reintentar conexión
    </button>
  </main>

  <footer class="footer-minimalista" style="margin-top:auto;padding:30px 0;">
    <div class="footer-contenedor">
      <div class="footer-fila-inferior" style="border-top:1px solid var(--accent);margin-top:0;padding-top:20px;text-align:center;">
        <p style="color:var(--text-sub);">© 2026 Monofilms. Todos los derechos reservados.</p>
      </div>
    </div>
  </footer>

  <script>
    const btn = document.getElementById('btn-reintentar');
    const msg = document.getElementById('estado-mensaje');

    btn.addEventListener('click', () => {
      msg.textContent = 'Comprobando disponibilidad de red...';
      btn.style.opacity = '0.5';
      btn.disabled = true;

      // Fetch real contra index.html para verificar conectividad verdadera
      fetch('./index.html', { cache: 'no-store', signal: AbortSignal.timeout(5000) })
        .then(res => {
          if (res.ok) {
            window.location.href = './index.html';
          } else {
            throw new Error('not ok');
          }
        })
        .catch(() => {
          setTimeout(() => {
            msg.textContent = 'La conexión sigue inestable. Asegurate de tener datos móviles o Wi-Fi activado.';
            btn.style.opacity = '1';
            btn.disabled = false;
          }, 1000);
        });
    });
  </script>
</body>
</html>
